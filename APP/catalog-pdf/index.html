<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prime Line Autumn 2026 product catalog.">
  <title>Prime Line Catalog — Autumn 2026</title>
  <link rel="icon" type="image/gif" href="/images/favicon.gif">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="./catalog-pdf.css">
</head>
<body>
  <header class="catalog-header">
    <a class="catalog-brand" href="/" aria-label="Prime Line home">
      <img src="/images/Logo1500.png" alt="Prime Line">
    </a>
    <nav class="catalog-header-actions" aria-label="Catalog actions">
      <a class="catalog-header-button catalog-back" href="/" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"></path></svg>
        <span>Back to Home</span>
      </a>
      <a class="catalog-action catalog-download" id="staffDownloadButton" href="/api/catalog/staff/download" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 18v3h14v-3"></path></svg>
        <span><strong>DOWNLOAD PDF</strong><small>PRIME LINE STAFF ONLY</small></span>
      </a>
      <button class="catalog-header-button catalog-share" id="shareCatalogButton" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.7 10.6 6.6-4.1m-6.6 7 6.6 4"></path></svg>
        <span>Share Catalog</span>
      </button>
    </nav>
  </header>

  <main class="catalog-main">
    <div class="catalog-heading">
      <span class="catalog-eyebrow">PRODUCT CATALOG</span>
      <h1>Prime Line Catalog — Autumn 2026</h1>
    </div>

    <p class="catalog-access-status" id="catalogAccessStatus" role="status" aria-live="polite">
      Verifying your Catalog PDF access...
    </p>
    <button class="catalog-action" id="catalogAccessRetry" type="button" hidden>Try again</button>

    <section class="catalog-viewer" id="catalogViewer" aria-label="Catalog viewer" hidden>
      <p class="catalog-viewer-status" id="catalogViewerStatus" role="status" aria-live="polite">
        Loading the catalog...
      </p>
      <iframe
        id="catalogFrame"
        title="Prime Line Catalog — Autumn 2026"
        allow="clipboard-write; autoplay; encrypted-media; fullscreen; picture-in-picture"
        sandbox="allow-top-navigation allow-top-navigation-by-user-activation allow-downloads allow-scripts allow-same-origin allow-popups allow-modals allow-popups-to-escape-sandbox allow-forms"
        allowfullscreen="true"
        data-src="https://e.issuu.com/embed.html?d=florida_spring_2021_compressed&amp;hideIssuuLogo=true&amp;hideShareButton=true&amp;u=primelinedist">
      </iframe>
      <div class="catalog-viewer-error" id="catalogViewerError" role="alert" hidden>
        <p>The catalog viewer did not finish loading.</p>
        <button class="catalog-action" id="catalogViewerRetry" type="button">Retry viewer</button>
      </div>
    </section>
  </main>

  <dialog class="catalog-share-dialog" id="shareCatalogDialog" aria-labelledby="shareCatalogTitle">
    <form class="catalog-share-form" id="shareCatalogForm">
      <span class="catalog-eyebrow">EMPLOYEE ACCESS</span>
      <h2 id="shareCatalogTitle">Share the private catalog</h2>
      <label for="customerEmail">Customer email</label>
      <input id="customerEmail" name="customerEmail" type="email" autocomplete="email" maxlength="254" required>
      <label for="guestDuration">Access duration</label>
      <select id="guestDuration" name="duration" required>
        <option value="24-hours">24 Hours</option>
        <option value="7-days" selected>7 Days</option>
        <option value="1-month">1 Month</option>
        <option value="3-months">3 Months</option>
        <option value="permanent">Permanent</option>
      </select>
      <p class="catalog-share-status" id="shareCatalogStatus" role="status" aria-live="polite"></p>
      <div class="catalog-share-actions">
        <button class="catalog-header-button" id="cancelShareCatalog" type="button">Cancel</button>
        <button class="catalog-action" type="submit">Send private invitation</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./catalog-pdf.js"></script>
</body>
</html>
