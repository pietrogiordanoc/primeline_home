[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  included_files = ["PDF/**"]

[[redirects]]
  from = "/api/access/request-code"
  to = "/.netlify/functions/request-code"
  status = 200

[[redirects]]
  from = "/api/access/verify-code"
  to = "/.netlify/functions/verify-code"
  status = 200

[[redirects]]
  from = "/api/access/catalog-session"
  to = "/.netlify/functions/catalog-session"
  status = 200

[[redirects]]
  from = "/api/admin/catalog-guests"
  to = "/.netlify/functions/catalog-guest-admin"
  status = 200

[[redirects]]
  from = "/api/catalog/guest/redeem"
  to = "/.netlify/functions/catalog-guest-redeem"
  status = 200

[[redirects]]
  from = "/api/catalog/guest/request-link"
  to = "/.netlify/functions/catalog-guest-request-link"
  status = 200

[[redirects]]
  from = "/api/catalog/guest/session"
  to = "/.netlify/functions/catalog-guest-session"
  status = 200

[[redirects]]
  from = "/api/catalog/guest/pdf"
  to = "/.netlify/functions/catalog-guest-pdf"
  status = 200

[[redirects]]
  from = "/api/catalog/staff/download"
